name: Deploy demo to GitHub Pages

# Publishes the static docs/ folder. The demo is plain HTML/CSS/JS plus the
# sample images committed by scripts/make_demo_assets.py -- nothing is built.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Warn if no samples are published
        run: |
          if [ ! -f docs/samples/manifest.json ]; then
            echo "::warning::docs/samples/manifest.json is missing - the demo will render its setup instructions instead of images."
          else
            python -c "import json;m=json.load(open('docs/samples/manifest.json'));print(f\"Publishing {len(m['samples'])} samples, model outputs: {m['has_model_outputs']}\")"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
