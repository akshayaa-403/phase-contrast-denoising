[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-cleanup"
version = "1.0.0"
description = "Phase-contrast microscopy halo and illumination clean-up: a classical OpenCV path with an optional residual U-Net."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "akshayaa-403" }]
dependencies = [
    "torch>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "scikit-image>=0.21.0",
    "scipy>=1.10.0",
    "tifffile>=2023.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tensorboard>=2.13.0",
    "tqdm>=4.65.0",
    "thop>=0.1.1",
]

[project.optional-dependencies]
demo = ["gradio>=4.0.0"]
export = ["onnx>=1.15", "onnxscript>=0.1", "onnxruntime>=1.17"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools]
packages = ["phase_cleanup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["phase_cleanup"]
